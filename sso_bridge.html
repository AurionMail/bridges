<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
  const SSO_ORIGIN = 'https://sso.DOMAIN_TO_REPLACE';
  const WEBMAIL_ORIGIN = 'https://web.DOMAIN_TO_REPLACE';
  const DB_NAME = 'AurionAuth';
  const AURION_STORE = 'keys';
  const KEY = 'token';


  function writeSecret(secret, sourceWindow, origin) {
    const req = indexedDB.open(DB_NAME);
    
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(AURION_STORE)) {
        db.createObjectStore(AURION_STORE);
      }
    };

    req.onsuccess = (e) => {
      const db = e.target.result;
      const transaction = db.transaction(AURION_STORE, "readwrite");
      const store = transaction.objectStore(AURION_STORE);
      store.put(secret, KEY);

      transaction.oncomplete = () => {
        db.close();
        sourceWindow.postMessage({ type: 'WRITE_SUCCESS' }, origin);
      };

      transaction.onerror = () => {
        db.close();
        sourceWindow.postMessage({ type: 'WRITE_ERROR', error: transaction.error }, origin);
      };
    };

    req.onerror = () => {
      sourceWindow.postMessage({ type: 'WRITE_ERROR', error: req.error }, origin);
    };
  }

  window.addEventListener('message', async (event) => {
     if (event.origin !== SSO_ORIGIN && event.origin !== WEBMAIL_ORIGIN) return;

    if (!event.data) return;
    else if (event.data.type === 'WRITE_SSO_TOKEN' && event.data.token) {
      writeSecret(event.data.token, event.source, event.origin);
    }
  });
</script>
</body>
</html>
