<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
  const PAD_ORIGIN = 'https://pad.DOMAIN_TO_REPLACE';

  window.addEventListener('message', (event) => {
    // Security check: only accept messages from your main domain
    if (event.origin !== PAD_ORIGIN) return;

    if (event.data && event.data.type === 'WRITE_SAND_DATA') {
      // Open IndexedDB for the sand domain
      const req = indexedDB.open("AurionAuth", 1);
      
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        db.createObjectStore("keys");
      };

      req.onsuccess = (e) => {
        const db = e.target.result;
        const transaction = db.transaction("keys", "readwrite");
        const store = transaction.objectStore("keys");
        
        // Store the properties sent by the main bridge
        if (event.data.color) store.put(event.data.color, "color");
        if (event.data.server) store.put(event.data.server, "server");
        if (event.data.mail) store.put(event.data.mail, "mail");

        transaction.oncomplete = () => {
          // Notify the main bridge that the storage is complete
          event.source.postMessage({ type: 'SAND_WRITE_SUCCESS' }, event.origin);
        };
      };
    }
  });
</script>
</body>
</html>
